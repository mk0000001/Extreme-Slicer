name: Shared core CUDA buffer reuse validation

on:
  push:
    branches: [ci/gpu-cuda-buffer-reuse-20261106]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ssrobins/install-cmake@v1
        with:
          version: 3.31.6
      - run: sudo apt-get update -qq && sudo apt-get install -y libboost-dev
      - run: cmake -S tests/gpu_safety -B build-gpu
      - run: cmake --build build-gpu --parallel 2
      - run: ctest --test-dir build-gpu --output-on-failure

      - name: Run all registered CUDA buffer ownership contracts
        run: |
          set -euo pipefail
          ./build-gpu/gpu_safety_tests '[CudaDispatchBuffers]' --order rand --rng-seed 9473 --reporter xml --out cuda-buffer-results.xml
          python3 .github/gpu-validation/check_cuda_buffer_results.py --xml cuda-buffer-results.xml --source tests/libslic3r/test_cuda_dispatch_buffers.cpp > cuda-buffer-results-summary.json
          cat cuda-buffer-results-summary.json
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cuda-buffer-reuse-contract-evidence-Linux
          path: |
            cuda-buffer-results.xml
            cuda-buffer-results-summary.json
            build-gpu/Testing/Temporary/LastTest.log
            build-gpu/CMakeCache.txt

  windows-cuda-vulkan:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: ssrobins/install-cmake@v1
        with:
          version: 3.31.6
      - uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'
      - name: Install Pascal-capable CUDA compiler
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d
        with:
          cuda: '12.9.1'
          method: network
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'
          use-github-cache: true
          use-local-cache: true
      - name: Install Vulkan compiler and development headers
        run: choco install vulkan-sdk --version=1.4.363 --yes --no-progress
      - name: Fetch verified Boost headers
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://archives.boost.io/release/1.84.0/source/boost_1_84_0.tar.gz' -OutFile boost-source.tar.gz
          if ((Get-FileHash boost-source.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a5800f405508f5df8114558ca9855d2640a2de8f0445f051fa1c7c3383045724') { throw 'Boost archive digest mismatch' }
          tar -xzf boost-source.tar.gz
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $boost = (Get-ChildItem -Directory -Filter 'boost*' | Where-Object { Test-Path (Join-Path $_.FullName 'boost/version.hpp') } | Select-Object -First 1).FullName
          if (-not $boost) { throw 'Boost header layout missing' }
          "BOOST_ROOT=$boost" | Add-Content $env:GITHUB_ENV
          $vk = (Get-ChildItem 'C:/VulkanSDK' -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          if (-not $vk) { throw 'Vulkan SDK missing' }
          "VULKAN_SDK=$vk" | Add-Content $env:GITHUB_ENV
      - name: Fetch verified official Vulkan runtime components
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://sdk.lunarg.com/sdk/download/1.4.363.0/windows/vulkan-runtime-components.zip' -OutFile vulkan-runtime-components.zip
          if ((Get-FileHash vulkan-runtime-components.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a25a927aa8b9f0371048f1861cf88ac3b9bc9b1fb332c42d897c8ab32695769a') { throw 'Vulkan runtime digest mismatch' }
          Expand-Archive vulkan-runtime-components.zip vulkan-runtime
          $runtime = (Get-ChildItem vulkan-runtime -Directory | Select-Object -First 1).FullName
          if (-not (Test-Path "$runtime/x64/vulkan-1.dll")) { throw 'Unexpected Vulkan runtime layout' }
          "VULKAN_RUNTIME_DIR=$runtime" | Add-Content $env:GITHUB_ENV
      - name: Configure the actual CUDA and Vulkan backends
        shell: pwsh
        run: |
          nvcc --version
          cmake -S tests/gpu_safety -B build-gpu -G 'Visual Studio 17 2022' -A x64 -T "cuda=$env:CUDA_PATH" -DSLIC3R_ENABLE_CUDA_SLICER=ON -DSLIC3R_ENABLE_VULKAN_SLICER=ON -DCMAKE_CUDA_ARCHITECTURES=61 "-DBOOST_ROOT=$env:BOOST_ROOT"
      - run: cmake --build build-gpu --config Release --parallel 2
      - name: Contract tests and CPU fallback with both backends compiled
        shell: pwsh
        run: |
          ctest --test-dir build-gpu -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & build-gpu/Release/slicer-gpu-selftest.exe build-gpu/resources/vulkan cpu
      - name: Run all registered CUDA buffer ownership contracts
        shell: pwsh
        run: |
          & build-gpu/Release/gpu_safety_tests.exe '[CudaDispatchBuffers]' --order rand --rng-seed 9473 --reporter xml --out cuda-buffer-results.xml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python .github/gpu-validation/check_cuda_buffer_results.py --xml cuda-buffer-results.xml --source tests/libslic3r/test_cuda_dispatch_buffers.cpp > cuda-buffer-results-summary.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Content cuda-buffer-results-summary.json
      - name: Package kernel diagnostic and matching runtimes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path gpu-diagnostic/resources/vulkan -Force | Out-Null
          Copy-Item build-gpu/Release/*.exe gpu-diagnostic
          Copy-Item build-gpu/resources/vulkan/*.spv gpu-diagnostic/resources/vulkan
          $cudart = Get-ChildItem "$env:CUDA_PATH/bin" -Filter 'cudart64_12.dll' | Select-Object -First 1
          $loader = Get-Item "$env:VULKAN_RUNTIME_DIR/x64/vulkan-1.dll"
          if (-not $cudart -or -not $loader) { throw 'Portable GPU runtime missing' }
          Copy-Item $cudart.FullName gpu-diagnostic
          Copy-Item $loader.FullName gpu-diagnostic
          Copy-Item LICENSE.txt gpu-diagnostic/LICENSE-AGPL-3.0.txt
          New-Item -ItemType Directory -Path gpu-diagnostic/licenses -Force | Out-Null
          Get-ChildItem "$env:CUDA_PATH" -File | Where-Object Name -Match 'LICENSE|EULA' | Copy-Item -Destination gpu-diagnostic/licenses
          Copy-Item "$env:VULKAN_RUNTIME_DIR/VulkanRT-License.txt" gpu-diagnostic/licenses
          if (Test-Path "$env:VULKAN_SDK/License") { Copy-Item "$env:VULKAN_SDK/License" gpu-diagnostic/licenses/VulkanSDK -Recurse }
          git rev-parse HEAD | Set-Content gpu-diagnostic/SOURCE-COMMIT.txt
          'This is a compute diagnostic, not the slicer app. Run slicer-gpu-selftest.exe resources/vulkan cuda or vulkan. Both must dispatch and validate; no speedup is claimed.' | Set-Content gpu-diagnostic/README.txt
          $sourcePaths = @('src/libslic3r/Gpu','tests/gpu_safety','tests/libslic3r/test_gpu_exact_geometry.cpp','tests/libslic3r/test_gpu_batch_preflight.cpp','tests/libslic3r/test_cuda_dispatch_buffers.cpp','tests/libslic3r/CMakeLists.txt','docs/superpowers/plans/2026-11-06-cuda-buffer-reuse.md','.github/gpu-validation/check_cuda_buffer_results.py','.github/workflows/gpu-runtime-validation.yml','LICENSE.txt')
          git -c core.autocrlf=false -c core.eol=lf archive --format=tar --output=gpu-diagnostic/source.tar HEAD -- $sourcePaths
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $sourceFiles = @(git ls-tree -r --name-only HEAD -- $sourcePaths)
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $members = @(tar -tf gpu-diagnostic/source.tar | Where-Object { $_ -and -not $_.EndsWith('/') })
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (@(Compare-Object ($sourceFiles | Sort-Object) ($members | Sort-Object)).Count) { throw 'Source archive membership differs from exact tracked source list' }
          foreach ($required in @('src/libslic3r/Gpu/CudaDispatchBuffers.hpp','tests/libslic3r/test_cuda_dispatch_buffers.cpp','tests/gpu_safety/CMakeLists.txt')) {
            if ($sourceFiles -notcontains $required) { throw "Required reviewed source missing: $required" }
          }
          git ls-tree -r HEAD -- $sourcePaths | Set-Content gpu-diagnostic/SOURCE-GIT-TREE.txt -Encoding utf8
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          (git rev-parse 'HEAD^{tree}').Trim() | Set-Content gpu-diagnostic/SOURCE-TREE.txt -Encoding ascii
          "https://github.com/$env:GITHUB_REPOSITORY/tree/$env:GITHUB_SHA" | Set-Content gpu-diagnostic/SOURCE-URL.txt -Encoding ascii
          Copy-Item cuda-buffer-results.xml,cuda-buffer-results-summary.json gpu-diagnostic
          'Reviewed bounded CUDA allocation reuse. Host contracts and CI CPU fallback do not establish physical GPU correctness, allocation counts or slicer speed. No product app is included. Hardware validation remains pending.' | Set-Content gpu-diagnostic/BUFFER-REUSE-VALIDATION.txt -Encoding utf8
          $manifest = @()
          foreach ($file in @(Get-ChildItem gpu-diagnostic -Recurse -File | Sort-Object FullName)) {
            $manifest += [ordered]@{path=[IO.Path]::GetRelativePath((Join-Path $pwd 'gpu-diagnostic'),$file.FullName).Replace([char]92,[char]47);bytes=$file.Length;sha256=(Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content gpu-diagnostic/FILE-SHA256.json -Encoding utf8
          Compress-Archive gpu-diagnostic GPU-kernel-diagnostic-Windows-sm61.zip
          Get-FileHash GPU-kernel-diagnostic-Windows-sm61.zip -Algorithm SHA256 | Format-List
          $digest = (Get-FileHash GPU-kernel-diagnostic-Windows-sm61.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  GPU-kernel-diagnostic-Windows-sm61.zip" | Set-Content package-sha256.txt -Encoding ascii
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cuda-buffer-reuse-contract-evidence-Windows
          path: |
            cuda-buffer-results.xml
            cuda-buffer-results-summary.json
            build-gpu/Testing/Temporary/LastTest.log
            build-gpu/CMakeCache.txt
            gpu-diagnostic/FILE-SHA256.json
            gpu-diagnostic/SOURCE-GIT-TREE.txt
            gpu-diagnostic/SOURCE-TREE.txt
            package-sha256.txt
      - uses: actions/upload-artifact@v6
        with:
          name: gpu-cuda-buffer-reuse-windows-sm61
          path: GPU-kernel-diagnostic-Windows-sm61.zip
